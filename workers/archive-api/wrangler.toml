name = "anekaroopam-archive-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
REQUIRED_ROLES = "original,artwork,preview,thumb"
R2_PUBLIC_BASE_URL = "https://media.anekaroopam.art"
R2_KEY_PREFIX = "dev/"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "anekaroopam-archive-dev"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[env.dev.vars]
REQUIRED_ROLES = "original,artwork,preview,thumb"
R2_PUBLIC_BASE_URL = "https://media.anekaroopam.art"
R2_KEY_PREFIX = "dev/"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "anekaroopam-archive-prod"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "migrations"

[env.prod.vars]
REQUIRED_ROLES = "original,artwork,preview,thumb"
R2_PUBLIC_BASE_URL = "https://media.anekaroopam.art"
R2_KEY_PREFIX = ""
